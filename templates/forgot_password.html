<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - FaceAuth</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
</head>
<body class="bg-light d-flex align-items-center justify-content-center vh-100">
    <div class="card shadow-lg border-0 rounded-4" style="width: 100%; max-width: 450px;">
        <div class="card-body p-5">
            <div class="text-center mb-4">
                <i class="fas fa-unlock-keyhole fa-3x text-primary mb-3"></i>
                <h3 class="fw-bold text-secondary">Forgot Password</h3>
                <p class="text-muted">Enter your email and we'll send you a reset link.</p>
            </div>
            
            {% with messages = get_flashed_messages(with_categories=true) %}
              {% if messages %}
                {% for category, message in messages %}
                  <div class="alert alert-{{ 'success' if category == 'success' else ('primary' if category == 'info' else 'danger') }} rounded-3 shadow-sm text-center">
                      {{ message }}
                  </div>
                {% endfor %}
              {% endif %}
            {% endwith %}

            <form method="POST" action="{{ url_for('forgot_password') }}">
                <div class="mb-3">
                    <label class="form-label text-muted fw-semibold">I am a...</label>
                    <select class="form-select" name="role" required>
                        <option value="student">Student</option>
                        <option value="professor">Professor</option>
                    </select>
                </div>
                <div class="mb-4">
                    <label class="form-label text-muted fw-semibold">Email Address</label>
                    <input type="email" class="form-control" name="email" required placeholder="Enter your registered email">
                </div>
                <button type="submit" class="btn btn-primary w-100 fw-bold py-2 rounded-pill shadow-sm">Send Reset Link</button>
            </form>
            <div class="text-center mt-4">
                <a href="{{ url_for('login') }}" class="text-decoration-none text-muted"><i class="fas fa-arrow-left me-1"></i> Back to Login</a>
            </div>
        </div>
    </div>
</body>
</html>
