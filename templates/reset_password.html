<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - FaceAuth</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
</head>
<body class="bg-light d-flex align-items-center justify-content-center vh-100">
    <div class="card shadow-lg border-0 rounded-4" style="width: 100%; max-width: 450px;">
        <div class="card-body p-5">
            <div class="text-center mb-4">
                <i class="fas fa-shield-alt fa-3x text-success mb-3"></i>
                <h3 class="fw-bold text-secondary">Set New Password</h3>
                <p class="text-muted">Enter a strong new password for your account.</p>
            </div>
            
            {% with messages = get_flashed_messages(with_categories=true) %}
              {% if messages %}
                {% for category, message in messages %}
                  <div class="alert alert-{{ 'success' if category == 'success' else 'danger' }} rounded-3 shadow-sm text-center">
                      {{ message }}
                  </div>
                {% endfor %}
              {% endif %}
            {% endwith %}

            <form method="POST">
                <div class="mb-4">
                    <label class="form-label text-muted fw-semibold">New Password</label>
                    <div class="input-group">
                        <span class="input-group-text bg-white text-muted"><i class="fas fa-lock"></i></span>
                        <input type="password" class="form-control border-start-0" name="password" required minlength="6" placeholder="At least 6 characters">
                    </div>
                </div>
                <button type="submit" class="btn btn-success w-100 fw-bold py-2 rounded-pill shadow-sm">Save New Password</button>
            </form>
        </div>
    </div>
</body>
</html>
